<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.3.0/dist/streamlit.js"></script>
</head>
<body>
    <script>
        let lastRequestId = null;

        function onRender(event) {
            const args = event.detail.args;
            if (!args || !args.request_id) return;
            
            // Prevent infinite loops by only processing new requests
            if (args.request_id === lastRequestId) return;
            lastRequestId = args.request_id;

            const action = args.action;

            if (action === "check_status") {
                fetch("http://127.0.0.1:11434/api/tags")
                    .then(r => r.json())
                    .then(res => {
                        const hasModel = res.models && res.models.some(m => m.name.startsWith("qwen2.5:3b"));
                        Streamlit.setComponentValue({ status: "success", running: true, has_model: hasModel });
                    })
                    .catch(e => {
                        Streamlit.setComponentValue({ status: "error", running: false, has_model: false, error: "Connection failed (Check CORS or if Ollama is running)" });
                    });
            } else if (action === "generate") {
                fetch("http://127.0.0.1:11434/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(args.payload)
                })
                .then(r => r.json())
                .then(res => {
                    Streamlit.setComponentValue({ status: "success", response: res.response });
                })
                .catch(e => {
                    Streamlit.setComponentValue({ status: "error", error: e.toString() });
                });
            }
        }
        
        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
        Streamlit.setComponentReady();
        Streamlit.setFrameHeight(0);
    </script>
</body>
</html>
